<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · misogimodel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* The admin page. Only you can open it: Cloudflare Access stands in front of /admin and /api/admin,
   and the server checks Access's signed pass again on every save. Preview and Live each keep their
   own settings; the live page is red so it can't be mistaken for the test one. */
:root{--ink:#1B1D20;--muted:#6B7280;--line:#E5E2DC;--bg:#F6F4F0;--card:#fff;--acc:#E4572E;--ok:#1E7A3A;--bad:#B3261E;--soft:#FBFAF8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding:14px 28px;min-height:70px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
/* the website's own mark and name, exactly as its banner has them (site.css): the rock stands on the
   bar's bottom edge and rises three quarters of its height, the name stacked beside it */
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#0B0E12;align-self:stretch;margin:-14px 0;font-family:Inter,system-ui,sans-serif;line-height:normal}
.brand svg{display:block;flex:none;height:75%;width:auto;aspect-ratio:442/156;align-self:flex-end;margin-bottom:-1px}
.brand .word{display:flex;flex-direction:column;align-items:flex-start;font-size:20px;line-height:.9;text-transform:uppercase;letter-spacing:0;white-space:nowrap;transform:translateY(.03em)}
.brand .word > span:first-child{font-weight:800}
.brand .word > span:last-child{font-weight:400;letter-spacing:.036em;margin-right:-.036em}
.brand .adm{align-self:center;margin-left:4px;padding-left:14px;border-left:1px solid var(--line);font-size:15px;font-weight:600;color:var(--muted)}
body.live .brand{color:#fff}body.live .brand .adm{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.35)}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;background:#EEF6EF;color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg a{padding:5px 12px;font-size:12px;color:inherit;text-decoration:none}.seg a.on{background:var(--ink);color:#fff}
.sp{flex:1}
.saved{color:var(--muted);font-size:12.5px}.saved.bad{color:var(--bad);font-weight:600}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.45;cursor:default}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.livebar{display:none}
body.live{--bg:#FBE9E5}
body.live .livebar{display:block;background:#8E1C16;color:#fff;text-align:center;padding:7px;font-weight:600;letter-spacing:.02em}
body.live header{background:#B3261E;border-color:#8E1C16;color:#fff}
body.live .pill{background:rgba(255,255,255,.18);color:#fff}
body.live .seg{border-color:rgba(255,255,255,.4)}body.live .seg a.on{background:#fff;color:#B3261E}
body.live .saved{color:rgba(255,255,255,.85)}
body.live header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
body.live header .btn.p{background:#fff;color:#B3261E;border-color:#fff}
/* three columns: the sections list, the settings, and a panel down the right that checks them and
   shows what the studio will offer */
main{display:grid;grid-template-columns:160px minmax(0,1fr) 330px;gap:24px;padding:24px 28px;max-width:1720px}
nav{position:sticky;top:90px;align-self:start}
nav a{display:block;padding:7px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:#fff}
nav a.in{padding:4px 12px 4px 24px;font-size:13px;font-weight:400;color:var(--muted)}
nav small{display:block;color:var(--muted);margin:14px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
nav small:first-child{margin-top:0}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;scroll-margin-top:90px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:2px}.hd h2{flex:1;margin:0;font-size:17px}
.sub{color:var(--muted);margin:2px 0 14px;font-size:13px}
.st i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px}
.st.ok i{background:var(--ok)}.st.no i{background:var(--bad)}
.cp{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:30px;display:inline-grid;place-items:center;padding:0;cursor:pointer}
.cp:disabled{opacity:.4;cursor:default}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block;position:relative;overflow:hidden;flex:none}
.sw input[type=color]{position:absolute;inset:-6px;width:40px;height:40px;border:0;padding:0;opacity:0;cursor:pointer}
.row{display:grid;grid-template-columns:22px 34px minmax(0,1fr) 176px 74px 44px 30px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row.fin{grid-template-columns:22px 34px minmax(0,1fr) 176px 74px 44px 30px}
.row:first-child{border-top:0}
.row.dragging,.way.dragging{opacity:.4}.row.over,.way.over{box-shadow:0 -2px 0 var(--acc) inset}
.drag{color:#B8B4AC;cursor:grab;user-select:none;text-align:center}
.x{border:0;background:none;color:#A8A39A;cursor:pointer;font-size:15px}.x:disabled{visibility:hidden}.x:hover{color:var(--bad)}
.t{border:1px solid transparent;border-radius:7px;padding:4px 7px;width:100%;background:transparent;font-weight:600}
.t:hover,.t:focus{border-color:var(--line);background:var(--soft);outline:none}
.uses{display:block;color:var(--muted);font-size:12px;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hex{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);font-weight:400;text-transform:uppercase}
.tog{width:36px;height:21px;border-radius:99px;background:#D6D2CA;position:relative;border:0;cursor:pointer;padding:0;flex:none}
.tog:after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s}
.tog[aria-checked=true]{background:var(--ok)}.tog[aria-checked=true]:after{left:17.5px}
.tog:disabled{opacity:.5;cursor:default}
/* matte or standard: one big pill, the dark half slides to the one chosen */
.fpill{position:relative;display:grid;grid-template-columns:1fr 1fr;width:176px;height:34px;border-radius:99px;background:#EEEBE5;border:0;padding:3px;cursor:pointer;font-weight:600;font-size:13px}
.fpill:before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s ease}
.fpill[data-f=standard]:before{transform:translateX(100%)}
.fpill span{position:relative;z-index:1;display:grid;place-items:center;color:#8A857C;transition:color .2s}
.fpill[data-f=matte] span:first-child,.fpill[data-f=standard] span:last-child{color:#fff}
.fpill:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fpill:disabled{cursor:default;opacity:.6}
.row.pickrow{grid-template-columns:22px minmax(0,300px) 176px 74px minmax(0,1fr) 44px 30px}
.row.pickrow .fpill.none{visibility:hidden}
.row.filoff .pick>button{opacity:.6}
.add{margin-top:10px;color:var(--acc);font-weight:600;background:none;border:0;padding:0;cursor:pointer}
.add:disabled{color:var(--muted);cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
/* colour ways: the list on the left, the one being edited on the right */
.ways{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.way{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.way:hover{border-color:#CFCAC0}
.way.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.way.bad{border-color:var(--bad)}
.way .drag.no{visibility:hidden}
.way .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.way .bar{grid-column:2/4;height:12px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
.way .meta{grid-column:2/4;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.way .meta .warn{color:var(--bad);font-weight:600}
.way.off .nm,.way.off .bar{opacity:.45}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:#F1EEE8;color:#57534E;white-space:nowrap}
.edit{border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:14px 16px;position:sticky;top:90px}
.edit .empty{color:var(--muted);text-align:center;padding:40px 10px}
.edit .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.edit .top .t{font-size:16px}
.grid{width:100%;border-collapse:separate;border-spacing:0}
.grid th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center;padding:0 1px 8px;line-height:1.2;vertical-align:bottom;width:46px}
.grid th:last-child{width:24px}
.grid th:first-child{text-align:left}
.grid td{border-top:1px solid var(--line);padding:8px 2px;text-align:center;vertical-align:middle}
.grid td:first-child{text-align:left}
.tick{width:26px;height:26px;border-radius:7px;border:1.5px solid #CFCAC0;background:#fff;cursor:pointer;display:inline-grid;place-items:center;padding:0;color:#fff;font-size:14px}
.tick[aria-checked=true]{background:var(--ok);border-color:var(--ok)}
.tick:disabled{cursor:default;opacity:.55}
.slotn{display:inline-block;width:20px;color:var(--muted);font-size:12px}
.edit .foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.edit .err,section .err{color:var(--bad);font-size:12.5px;margin:10px 0 0;padding-left:16px}
/* titles and text: one row a line of words, grouped by page and part of the page */
.tpage{display:flex;align-items:center;gap:12px;margin:30px 0 12px;font-size:17px;font-weight:700;color:var(--ink)}
.tpage:after{content:"";flex:1;height:2px;border-radius:2px;background:var(--line)}
.tpage:first-of-type{margin-top:10px}
.tgroup{border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:10px}
.tgroup > b{display:block;font-size:13px;padding:8px 0 2px}
.trow{display:grid;grid-template-columns:130px minmax(0,1fr) 54px;gap:10px;align-items:start;padding:5px 0}
.trow .lbl2{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.trow .show{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.trow .show .tog{transform:scale(.85);transform-origin:left center}
.trow.off .tin{opacity:.45;text-decoration:line-through}
.trow > span, .trow .lbl2 > span{color:var(--muted);font-size:12.5px;padding-top:7px}
.trow.changed > span, .trow.changed .lbl2 > span{color:var(--ink);font-weight:600}
.trow.changed > span::after, .trow.changed .lbl2 > span::after{content:" •";color:var(--acc)}
.tin{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--soft);font:inherit;line-height:1.4;resize:none;overflow:hidden;display:block}
textarea.tin{min-height:calc(1.4em + 14px)}
.tin:focus{outline:none;border-color:var(--ink);background:#fff}
.reset{border:0;background:none;color:var(--acc);font-size:12px;font-weight:600;cursor:pointer;padding:7px 0 0;text-align:left}
.reset[hidden]{display:none}
/* questions */
.faq{display:grid;grid-template-columns:22px minmax(0,1fr) 30px;gap:6px 10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.faq.dragging{opacity:.4}.faq.over{box-shadow:0 -2px 0 var(--acc) inset}
.faq .drag{padding-top:6px}
.faq .qa{display:flex;flex-direction:column;gap:6px}
.faq .tin.q{font-weight:600}
.faq .x{align-self:start;padding-top:6px}
.fromfile{background:#F3F1EC;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;color:#57534E}
.del{color:var(--bad);border-color:#EBC9C5}
/* a dropdown that shows each colour as a circle */
.pick{position:relative;display:inline-block;width:100%}
.pick>button{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:5px 9px;cursor:pointer;text-align:left}
.pick>button:hover{border-color:#CFCAC0}
.pick>button.bad{border-color:var(--bad);color:var(--bad)}
.pick .dot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.pick .dot.none{border:1.5px dashed var(--bad);background:transparent}
.pick .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .car{color:var(--muted);font-size:11px}
.pick .offt{font-size:11px;color:var(--muted);background:#F1EEE8;border-radius:99px;padding:0 6px}
.pick [role=listbox]{position:absolute;z-index:40;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:280px;max-height:290px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:4px}
.pick [role=option]{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:6px 9px;border-radius:7px;cursor:pointer;text-align:left}
.pick [role=option]:hover,.pick [role=option].hi{background:#F3F1EC}
.pick [role=option][aria-selected=true]{font-weight:600}
.pick [role=option] .hex{margin-left:auto;padding-left:12px}
/* prices: cards rather than tables */
.group{margin-top:18px}.group:first-of-type{margin-top:4px}
.group h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px;position:relative}
.card.off{background:var(--soft)}.card.off .big,.card.off .name{opacity:.45}
.card .big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.card .name{color:var(--muted);font-size:12.5px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.card .ic{width:30px;height:30px;border-radius:9px;background:#F1EEE8;display:grid;place-items:center;color:#57534E}
.card .stripes{height:8px;border-radius:4px;display:flex;overflow:hidden;gap:2px}.card .stripes i{flex:1;background:#CFCAC0;border-radius:2px}
.card small{color:var(--muted);font-size:12px}
.money{border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%;max-width:120px;background:var(--soft);font-weight:600;font-size:15px}
.money:focus{outline:none;border-color:var(--ink);background:#fff}
.money.bad{border-color:var(--bad)}
.num{border:1px solid var(--line);border-radius:8px;padding:3px 6px;width:44px;background:var(--soft);text-align:center}
.note{background:#FFF6E8;border:1px solid #F2D9AE;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.rule{border:1px dashed #C9C4BA;border-radius:12px;padding:12px 14px;background:var(--soft);grid-column:span 2}
.rule .top{display:flex;align-items:center;gap:10px}
.rule select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.rule .eg{color:var(--muted);font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pcard div{flex:1;min-width:0}.pcard b{display:block}.pcard small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.pcard.off{background:var(--soft)}.pcard.off b{color:var(--muted)}
.grid th.offc{color:#B8B4AC}.grid th.offc small{display:block;font-weight:400;font-size:10.5px}
.grid td.offc .tick{opacity:.3}
.part{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 8px 5px 6px;font-size:13px}
.part .sw{width:22px;height:22px}
/* the panel down the right */
aside{position:sticky;top:90px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;display:flex;flex-direction:column;gap:14px}
aside .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
aside h3{margin:0 0 8px;font-size:14px}
aside ul{margin:0;padding:0;list-style:none}
aside li{display:flex;gap:8px;padding:5px 0;font-size:13px;border-top:1px solid var(--line)}
aside li:first-child{border-top:0}
aside li a{color:inherit}
aside .good{color:var(--ok);font-weight:600;font-size:13px}
aside .bad li::before{content:"!";flex:none;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
aside .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 6px}
aside .lbl:first-of-type{margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{border:1px solid var(--line);border-radius:9px;padding:6px;font-size:12px}
.tile .b{height:22px;border-radius:5px;margin-bottom:4px;border:1px solid rgba(0,0,0,.06)}
.tile small{color:var(--muted);display:block}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots span{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.15);position:relative}
.dots span.m:after{content:"M";position:absolute;right:-5px;bottom:-5px;font-size:8.5px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 3px;line-height:12px;color:var(--ink)}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;text-align:center}
.sizes div{border:1px solid var(--line);border-radius:8px;padding:5px 2px}.sizes div.off{opacity:.35;text-decoration:line-through}
.sizes b{display:block;font-size:12.5px}
/* the areas, as tabs across the top: only one area's sections show at a time */
.tabs{display:flex;gap:2px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:var(--hh,63px);z-index:29;overflow-x:auto}
.tabs button{border:0;background:none;padding:13px 16px 11px;font:inherit;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.tabs .n{font-size:11px;font-weight:500;background:#EFEDE8;border-radius:9px;padding:1px 7px;color:var(--muted)}
.tabs .n.ch{background:#F2B705;color:var(--ink)}.tabs .n.bad{background:var(--bad);color:#fff}
body.live .tabs{background:#fff}
nav, aside{top:calc(var(--hh,63px) + 70px)}
section{scroll-margin-top:calc(var(--hh,63px) + 66px)}
/* the emails */
.mail{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:6px 16px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.mail:first-of-type{border-top:0}
.mail b{font-size:14.5px}.mail .who{color:var(--muted);font-size:12.5px;margin-top:1px}
.mail .to{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#EFEDE8;color:var(--muted);margin-left:6px;vertical-align:1px;font-weight:500}
.mail .to.c{background:#E6F0FA;color:#1F5E8C}
.mail .acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.mail .tog{margin-top:3px}
.mail .copies{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.mail .copies input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px;width:210px;color:var(--ink)}
.mail .copies input.bad{border-color:var(--bad);background:#FDF1EF}
.mail .copies .cx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px 0 0;margin-left:-4px}
.mail.off b,.mail.off .who{opacity:.55}
.mail .tnote{font-size:12px;color:var(--muted);max-width:170px;text-align:right;line-height:1.35}
/* the history */
.hist{border-top:1px solid var(--line);padding:12px 0}
.hist:first-of-type{border-top:0}
.hist .when{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.hist .when b{color:var(--ink);font-size:13.5px}
.hist .site{font-size:11px;font-weight:600;border-radius:9px;padding:1px 8px;background:#EFEDE8;color:var(--ink)}
.hist .site.live{background:#B3261E;color:#fff}
.hist ul{margin:6px 0 0;padding:0;list-style:none}
.hist li{font-size:13px;padding:2px 0;display:flex;gap:8px}
.hist li i{font-style:normal;color:var(--muted);flex:none;min-width:112px}
.histbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 10px;font-size:12.5px;color:var(--muted)}
.histbar .seg button{border:0;background:none;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;color:inherit}
.histbar .seg button.on{background:var(--ink);color:#fff}
#gate{max-width:520px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 28px;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
@media (max-width:1420px){.ways{grid-template-columns:1fr}.edit{position:static}}
@media (max-width:1240px){main{grid-template-columns:150px minmax(0,1fr)}aside{grid-column:2;position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:860px){main{grid-template-columns:1fr}nav{display:none}.tabs{padding:0 8px}aside{grid-column:1;grid-template-columns:1fr}.two,.ways{grid-template-columns:1fr}.edit{position:static}
  .row{grid-template-columns:18px 30px minmax(0,1fr) 40px 24px}.row .hex{display:none}.row.fin{grid-template-columns:18px 30px minmax(0,1fr) 120px 40px 24px}.row.pickrow{grid-template-columns:18px minmax(0,1fr) 120px 0 40px 24px}.rule{grid-column:auto}}
</style>

    else if (!line.trim()) cur.a.push("");
    else cur.a[cur.a.length - 1] = (cur.a[cur.a.length - 1] ? cur.a[cur.a.length - 1] + " " : "") + line.trim();

    if (always) row.lastChild.title = "Always sent, so nothing is missed";
    const copies = el("div", { class: "copies" }, el("span", {}, to === "you" ? "Cc:" : "Bcc:"));
    e.copy.forEach((a, i) => copies.append(
      el("input", { type: "email", value: a, placeholder: "name@example.com", "aria-label": name + " copy " + (i + 1), "data-copy": i,
        oninput: (ev) => { e.copy[i] = ev.target.value; refresh(); } }),
      el("button", { class: "cx", title: "Remove", "aria-label": "Remove this copy", onclick: () => { e.copy.splice(i, 1); renderEmails(); refresh(); } }, "×")));
    if (!e.copy.length) copies.append(el("span", {}, "nobody else"));
    if (e.copy.length < S.MAX_COPIES) copies.append(el("button", { class: "btn sm", onclick: () => { e.copy.push(""); renderEmails(); refresh();
      const ins = sec.querySelectorAll('[data-email="' + key + '"] input'); ins[ins.length - 1].focus(); } }, "+ Add a copy"));
    row.append(copies);
    sec.append(row);
  }
}
// a copy address that's wrong is outlined in red, as well as listed on the right
function markCopies(wrong) {
  for (const inp of document.querySelectorAll("#emails input[data-copy]")) {
    const v = inp.value.trim().toLowerCase(), key = inp.closest("[data-email]").dataset.email, list = (work.emails[key].copy || []).map((a) => String(a).trim().toLowerCase());
    inp.classList.toggle("bad", !S.EMAIL_RE.test(v) || list.indexOf(v) !== +inp.dataset.copy);
  }
}
async function sendTest(key, btn) {
  btn.disabled = true; const was = btn.textContent; btn.textContent = "Sending…";
  try { await send("POST", "/api/admin/test-email", { email: key }); toast("Test sent to your inbox"); }
  catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = was;
}

function renderAll() {
  renderParts(); renderFilaments(); renderColourWays();
  renderColourLists();
  renderFinishes(); renderPrices(); renderText(); renderFaqs(); renderEmails(); refresh();
}

/* ---- saving and copying ---- */
async function send(method, path, body) {
  if (window.MISOGI_ADMIN) return window.MISOGI_ADMIN(method, path, body);
  const r = await api(path, method === "GET" ? { method } : { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "That didn't save (" + r.status + ").");
  return data;
}
$("save").addEventListener("click", async () => {
  const wrong = problems();
  if (wrong.length) { toast(wrong[0].msg); return; }
  const bad = document.querySelector(".money.bad");
  if (bad) { bad.focus(); toast("One of the prices isn't a number of pounds and pence."); return; }
  if (site === "Live" && !confirm("Publish these settings to the live site? Customers will see them straight away.")) return;
  $("save").disabled = true;
  try { take(await send("PUT", "/api/admin/settings", { settings: work })); toast(site === "Live" ? "Published to the live site" : "Saved"); loadHistory(); }
  catch (e) { toast(e.message); refresh(); }
});
$("discard").addEventListener("click", () => { work = clone(saved); if (editing && !work.colourWays.some((c) => c.key === editing)) editing = null; renderAll(); });
async function copy(section) {
  if (dirty()) { toast("Save or discard your changes first."); return; }
  const name = section === "all" ? "everything" : S.SECTION_NAMES[section];
  if (!confirm("Copy " + name + " from Preview to the live site? Customers will see it straight away.")) return;
  try { take(await send("POST", "/api/admin/copy", { section })); toast("Copied " + name + " from Preview"); loadHistory(); }
  catch (e) { toast(e.message); }
}
$("copyAll").addEventListener("click", () => copy("all"));
window.addEventListener("beforeunload", (e) => { if (work && dirty()) { e.preventDefault(); e.returnValue = ""; } });
load().catch((e) => gate("The settings couldn't be loaded: " + e.message));
</script>
